<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TaxiBook">
<title>TaxiBook Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f17;--s1:#121826;--s2:#18202f;--bd:#222c3f;--tx:#e8eef8;--mu:#7d8ba3;--ac:#5eead4;--ac2:#2dd4bf;--am:#fbbf24;--rd:#f87171;--pu:#a78bfa;--f:'Outfit',system-ui,sans-serif;--m:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--tx);font-family:var(--f);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 8px}
.logo{font-weight:800;font-size:1.05rem;letter-spacing:-.3px}.logo b{color:var(--ac)}
.date{font-size:.7rem;color:var(--mu);text-transform:capitalize}
main{flex:1;overflow-y:auto;padding:6px 14px 20px;-webkit-overflow-scrolling:touch}
.sec{display:none}.sec.on{display:block}
nav{display:flex;background:var(--s1);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);font:600 .68rem var(--f);padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button i{font-style:normal;font-size:1.2rem}nav button.on{color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.lbl{font-size:.62rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--mu);margin-bottom:6px}
.btn{border:0;border-radius:12px;padding:14px;font:700 .95rem var(--f);width:100%;cursor:pointer;color:#06201c;background:linear-gradient(135deg,var(--ac),var(--ac2))}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--bd);width:auto;padding:9px 14px;font-size:.8rem}
.btn.sec2{background:var(--s2);color:var(--tx);border:1px solid var(--bd);margin-bottom:8px;text-align:left;font-weight:600;font-size:.85rem}
.btn.red{background:rgba(248,113,113,.1);color:var(--rd);border:1px solid rgba(248,113,113,.3)}
.btn:disabled{opacity:.4}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.jl{font-weight:700;font-size:.95rem}.js{font-size:.75rem;color:var(--mu);margin:3px 0 12px;text-transform:none}.js b{color:var(--tx);text-transform:capitalize}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.st{background:var(--s2);border-radius:12px;padding:10px}.st .v{font-family:var(--m);font-weight:700;font-size:1.05rem}.st .k{font-size:.58rem;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
.disp{font:700 2.6rem var(--m);text-align:right;padding:6px 6px 10px;letter-spacing:-1px}.disp span{font-size:1.2rem;color:var(--mu)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.quick button{background:var(--s2);border:2px solid var(--bd);border-radius:14px;color:var(--tx);font:800 1.7rem var(--m);padding:18px 0;cursor:pointer}
.quick button.on{border-color:var(--ac);color:var(--ac);background:rgba(94,234,212,.08)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.pad button{background:var(--s2);border:1px solid var(--bd);border-radius:12px;color:var(--tx);font:600 1.4rem var(--m);padding:14px 0}
.pad button:active,.quick button:active{transform:scale(.97)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.seg button{background:var(--s2);border:2px solid var(--bd);border-radius:12px;color:var(--mu);font:600 .8rem var(--f);padding:11px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.seg button i{font-style:normal;font-size:1.2rem}.seg button.on{border-color:var(--ac);color:var(--ac);background:rgba(94,234,212,.08)}
.warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:var(--am);border-radius:12px;padding:10px 12px;font-size:.78rem;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.warn.crit{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.3);color:var(--rd)}
.warn button{background:none;border:1px solid currentColor;color:inherit;border-radius:8px;padding:5px 9px;font:700 .7rem var(--f)}
.dh{display:flex;justify-content:space-between;align-items:baseline;margin:16px 4px 8px}.dh b{font-size:.85rem;text-transform:capitalize}.dh span{font:700 .8rem var(--m);color:var(--ac)}
.tr{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.tr .h{font:500 .72rem var(--m);color:var(--mu);width:42px}.tr .a{font:700 1rem var(--m);flex:1}
.bd{font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:20px}.bd.efectivo{background:rgba(94,234,212,.12);color:var(--ac)}.bd.tarjeta{background:rgba(167,139,250,.14);color:var(--pu)}.bd.app{background:rgba(251,191,36,.12);color:var(--am)}
.x{background:none;border:0;color:var(--mu);font-size:1rem;padding:4px 6px}
.hint{font-size:.72rem;color:var(--mu);line-height:1.45;margin:4px 0 10px}
select{background:var(--s2);border:1px solid var(--bd);border-radius:10px;color:var(--tx);font:600 .9rem var(--m);padding:10px;width:100%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.on{display:flex}.sheet{background:var(--s1);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;border:1px solid var(--bd)}
.sheet h3{margin-bottom:12px}
#toast{position:fixed;left:14px;right:14px;bottom:calc(76px + env(safe-area-inset-bottom));background:#263248;border-radius:12px;padding:12px 14px;font-size:.85rem;font-weight:600;display:none;justify-content:space-between;align-items:center;z-index:60}
#toast button{background:none;border:0;color:var(--ac);font:700 .85rem var(--f)}
.empty{text-align:center;color:var(--mu);padding:40px 0;font-size:.85rem}
/* compacto: todo cabe sin desplazar */
header{padding:8px 16px 4px}main{padding:4px 12px 12px}
nav button{padding:7px 0 6px}nav button i{font-size:1.05rem}
.card{padding:10px;margin-bottom:8px;border-radius:14px}
.stats{gap:6px;margin-top:8px}.st{padding:6px 8px}.st .v{font-size:.9rem}.st .k{font-size:.55rem}
.wk{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:.7rem;color:var(--mu);text-transform:capitalize}.wk b{font:700 .78rem var(--m);color:var(--ac);text-transform:none}
.disp{font-size:2rem;padding:0 4px 4px}
.quick{gap:8px;margin-bottom:8px}.quick button{font-size:1.3rem;padding:10px 0;border-radius:12px}
.pad{gap:6px;margin-bottom:8px}.pad button{font-size:1.1rem;padding:8px 0;border-radius:10px}
.seg{gap:6px;margin-bottom:8px}.seg button{flex-direction:row;justify-content:center;gap:6px;padding:8px 0;font-size:.75rem}.seg button i{font-size:1rem}
.btn{padding:12px}
/* rellena toda la pantalla */
header{padding:8px 16px 4px}.logo{font-size:1.05rem}main{padding:4px 12px 10px}
nav button{padding:8px 0 7px;font-size:.68rem}nav button i{font-size:1.1rem}
#s-viaje.on{display:flex;flex-direction:column;min-height:100%}
#s-viaje .card{padding:10px;margin-bottom:8px}
#amtcard{flex:1;display:flex;flex-direction:column;min-height:330px;margin-bottom:0}
.jl{font-size:.95rem}.js{font-size:.74rem}
.stats{gap:6px;margin-top:8px}.st{padding:7px 9px}.st .v{font-size:1rem}.st .k{font-size:.56rem}
.wk{margin-top:8px;font-size:.72rem}.wk b{font-size:.82rem}
.disp{font-size:2.5rem;padding:0 6px 6px}.disp span{font-size:1.2rem}
.quick{gap:8px;margin-bottom:8px}.quick button{font-size:1.6rem;padding:14px 0;border-width:2px}
.pad{flex:1;min-height:0;gap:7px;margin-bottom:8px;grid-template-rows:repeat(4,1fr)}
.pad button{font-size:clamp(1.3rem,3.4vh,1.9rem);padding:0}
.seg{gap:7px;margin-bottom:8px}.seg button{padding:12px 0;font-size:.82rem;border-width:2px}.seg button i{font-size:1.1rem}
.btn{padding:15px;font-size:1rem}.btn.ghost{padding:9px 16px;font-size:.85rem}
</style>
</head>
<body>
<header><div class="logo">Taxi<b>Book</b> Pro</div><div class="date" id="hdate"></div></header>
<main>
  <section class="sec on" id="s-viaje">
    <div id="bk"></div>
    <div class="card" id="jcard"></div>
    <div class="card" id="amtcard">
            <div class="disp" id="disp"></div>
      <div class="quick"><button id="q22" onclick="setAmt('22')">22 €</button><button id="q33" onclick="setAmt('33')">33 €</button></div>
      <div class="pad" id="pad"></div>
      <div class="seg" id="seg">
        <button data-p="efectivo" class="on"><i>💵</i>Efectivo</button>
        <button data-p="tarjeta"><i>💳</i>Tarjeta</button>
        <button data-p="app"><i>📱</i>App</button>
      </div>
      <button class="btn" onclick="guardar()">Guardar viaje</button>
    </div>
  </section>
  <section class="sec" id="s-viajes"><div id="lista"></div></section>
  <section class="sec" id="s-ajustes">
    <div class="card">
      <div class="lbl">Copia de seguridad</div>
      <div class="hint" id="bkinfo"></div>
      <button class="btn sec2" onclick="exportJSON()">💾 Descargar copia (JSON)</button>
      <button class="btn sec2" onclick="exportCSV()">📄 Exportar CSV</button>
      <button class="btn sec2" onclick="$('file').click()">📥 Importar copia (.json o .csv)</button>
      <input type="file" id="file" accept=".json,.csv" style="display:none" onchange="importar(event)">
    </div>
    <div class="card">
      <div class="lbl">Turnos de noche</div>
      <div class="hint">Un turno que empieza a partir de esta hora cuenta como del día siguiente. Así tu viernes de 23:00 a 13:00 entra entero en sábado.</div>
      <select id="noche" onchange="localStorage.setItem(NK,this.value);renderAll()"></select>
      <button class="btn sec2" style="margin-top:10px" onclick="recalcular()">🔧 Corregir días de viajes ya guardados</button>
    </div>
    <div class="card">
      <div class="lbl">Datos</div>
      <button class="btn sec2" onclick="purge90()">🗑 Borrar viajes de más de 90 días</button>
      <button class="btn red" onclick="resetAll()">Borrar todo</button>
    </div>
  </section>
</main>
<nav>
  <button class="on" data-t="viaje"><i>🚕</i>Viaje</button>
  <button data-t="viajes"><i>📋</i>Viajes</button>
  <button data-t="ajustes"><i>⚙️</i>Ajustes</button>
</nav>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
var $=function(i){return document.getElementById(i)};
var K='taxibookpro2',JK='taxibook_jornada',BK='taxibook_ultimoBackup',NK='taxibook_noche';
var amt='',pago='efectivo',tt;
function p2(n){return String(n).padStart(2,'0')}
function ld(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function umbral(){var n=parseInt(localStorage.getItem(NK));return isNaN(n)?20:n}
function fechaTurno(d){var x=new Date(d);if(x.getHours()>=umbral())x.setDate(x.getDate()+1);return ld(x)}
function fmt(n){return (+n||0).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtD(f){return new Date(f+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'short'})}
function fmtT(d){return new Date(d).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})}
function dur(ms){var m=Math.max(0,Math.floor(ms/60000));return Math.floor(m/60)+'h '+p2(m%60)+'m'}
function dsem(f){return new Date(f+'T12:00:00').getDay()}

/* ── datos (mismo formato que antes: tus viajes se conservan) ── */
function load(){
  try{var p=JSON.parse(localStorage.getItem(K));if(p&&Array.isArray(p.viajes))return p}
  catch(e){try{var b=JSON.parse(localStorage.getItem(K+'_bak'));if(b&&Array.isArray(b.viajes))return b}catch(x){}}
  return{viajes:[]};
}
var DB=load();
function save(){
  try{var o=localStorage.getItem(K);if(o)localStorage.setItem(K+'_bak',o);localStorage.setItem(K,JSON.stringify(DB));return true}
  catch(e){toast('⚠️ No se pudo guardar (almacenamiento lleno)');return false}
}
function getJ(){try{var j=JSON.parse(localStorage.getItem(JK));return j&&j.activa?j:null}catch(e){return null}}
function fechaActual(){var j=getJ();return j?j.fecha:fechaTurno(new Date())}
function statsDe(f){
  var vs=DB.viajes.filter(function(v){return v.fecha===f}),t=0,e=0;
  vs.forEach(function(v){t+=+v.total||0;if(v.pago==='efectivo')e+=+v.total||0});
  return{n:vs.length,t:t,e:e,o:t-e};
}

function semana(f){
  var d=new Date(f+'T12:00:00');d.setDate(d.getDate()-(d.getDay()+6)%7);var a=ld(d);d.setDate(d.getDate()+6);var b=ld(d);
  var t=0,n=0,ds={};
  DB.viajes.forEach(function(v){if(v.fecha>=a&&v.fecha<=b){t+=+v.total||0;n++;ds[v.fecha]=1}});
  return{t:t,n:n,d:Object.keys(ds).length,a:a,b:b};
}
function corto(f){return new Date(f+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short'})}
/* ── pantalla Viaje ── */
function renderViaje(){
  var j=getJ(),f=fechaActual(),s=statsDe(f),w=semana(f),h=j?(Date.now()-new Date(j.inicio))/36e5:0;
  var top=j
   ?'<div class="row"><div><div class="jl">Jornada · <span style="text-transform:capitalize">'+fmtD(j.fecha)+'</span></div><div class="js" style="margin-bottom:0">desde '+fmtT(j.inicio)+' · '+dur(Date.now()-new Date(j.inicio))+'</div></div><button class="btn ghost" onclick="finJ()">Fin</button></div>'
   :'<div class="jl">Sin jornada iniciada</div><div class="js">Si empiezas ahora contará como <b>'+fmtD(fechaTurno(new Date()))+'</b></div><button class="btn" onclick="iniciar()">▶ Iniciar jornada</button>';
  $('jcard').innerHTML=top+'<div class="stats"><div class="st"><div class="v">'+fmt(s.t)+'€</div><div class="k">Total</div></div><div class="st"><div class="v">'+s.n+'</div><div class="k">Viajes</div></div><div class="st"><div class="v">'+(j&&h>0.1?fmt(s.t/h)+'€':'—')+'</div><div class="k">€/hora</div></div></div>'
   +'<div class="wk"><span>Semana '+corto(w.a)+' – '+corto(w.b)+'</span><span><b>'+fmt(w.t)+'€</b> · '+w.n+' viajes · '+(w.d?fmt(w.t/w.d)+'€/día':'—')+'</span></div>';
  $('disp').innerHTML=(amt===''?'0':amt.replace('.',','))+'<span> €</span>';
  $('q22').classList.toggle('on',amt==='22');$('q33').classList.toggle('on',amt==='33');
  document.querySelectorAll('#seg button').forEach(function(b){b.classList.toggle('on',b.dataset.p===pago)});
  $('hdate').textContent=new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
}
function setAmt(v){amt=v;renderViaje()}
function key(k){
  if(k==='⌫')amt=amt.slice(0,-1);
  else if(k===','){if(amt.indexOf('.')<0)amt=(amt===''?'0':amt)+'.'}
  else{var p=amt.split('.');if(p[1]&&p[1].length>=2)return;amt=amt==='0'?k:amt+k}
  renderViaje();
}
(function(){
  var h='';['1','2','3','4','5','6','7','8','9',',','0','⌫'].forEach(function(k){h+='<button onclick="key(\''+k+'\')">'+k+'</button>'});
  $('pad').innerHTML=h;
  document.querySelectorAll('#seg button').forEach(function(b){b.onclick=function(){pago=b.dataset.p;renderViaje()}});
  var o='';for(var i=18;i<=23;i++)o+='<option value="'+i+'">A partir de las '+i+':00</option>';
  $('noche').innerHTML=o;$('noche').value=umbral();
  document.querySelectorAll('nav button').forEach(function(b){b.onclick=function(){
    document.querySelectorAll('nav button').forEach(function(x){x.classList.toggle('on',x===b)});
    document.querySelectorAll('.sec').forEach(function(s){s.classList.toggle('on',s.id==='s-'+b.dataset.t)});
  }});
})();
function guardar(){
  var t=parseFloat(amt);
  if(!t||t<=0)return toast('Introduce el importe');
  var n=new Date(),f=fechaActual();
  var v={id:Date.now(),fecha:f,ts:n.toISOString(),hora:n.getHours(),diaSem:dsem(f),pago:pago,plataforma:'',total:t,efectivo:pago==='efectivo'?t:0,duracion:0,dist:0,startLat:null,startLng:null,startAddr:'',nota:''};
  DB.viajes.push(v);
  if(!save()){DB.viajes.pop();return}
  amt='';renderAll();
  toast('✅ '+fmt(t)+' € guardado',function(){DB.viajes=DB.viajes.filter(function(x){return x.id!==v.id});save();renderAll()});
}

/* ── jornada ── */
function iniciar(){
  var n=new Date();localStorage.setItem(JK,JSON.stringify({fecha:fechaTurno(n),activa:true,inicio:n.toISOString()}));
  renderAll();toast('🚦 Jornada iniciada · '+fmtD(fechaTurno(n)));
}
function finJ(){
  var j=getJ();if(!j)return;var s=statsDe(j.fecha),ms=Date.now()-new Date(j.inicio);
  function c(v,k){return '<div class="st"><div class="v">'+v+'</div><div class="k">'+k+'</div></div>'}
  $('sheet').innerHTML='<h3>Fin de jornada</h3><div class="stats" style="margin:0 0 12px">'+c(fmt(s.t)+'€','Total')+c(s.n,'Viajes')+c(ms>6e4?fmt(s.t/(ms/36e5))+'€':'—','€/hora')+c(fmt(s.e)+'€','Efectivo')+c(fmt(s.o)+'€','Tarjeta+App')+c(dur(ms),'Tiempo')+'</div><div class="hint">'+bkTxt()+'</div><button class="btn sec2" onclick="exportJSON()">💾 Hacer copia de seguridad ahora</button><button class="btn" onclick="cerrarJ()">Cerrar jornada</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="$(\'modal\').classList.remove(\'on\')">Volver</button>';
  $('modal').classList.add('on');
}
function cerrarJ(){localStorage.removeItem(JK);$('modal').classList.remove('on');renderAll();toast('✅ Jornada cerrada')}

/* ── lista de viajes ── */
function renderLista(){
  if(!DB.viajes.length){$('lista').innerHTML='<div class="empty">Aún no hay viajes</div>';return}
  var g={};DB.viajes.forEach(function(v){(g[v.fecha]=g[v.fecha]||[]).push(v)});
  var fs=Object.keys(g).sort().reverse().slice(0,30),h='';
  fs.forEach(function(f){
    var vs=g[f].sort(function(a,b){return new Date(b.ts)-new Date(a.ts)}),t=0;
    vs.forEach(function(v){t+=+v.total||0});
    h+='<div class="dh"><b>'+fmtD(f)+' · '+vs.length+'</b><span>'+fmt(t)+' €</span></div>';
    vs.forEach(function(v){
      var d=new Date(v.ts),hr=isNaN(d)?p2(v.hora||0)+':--':fmtT(d);
      h+='<div class="tr"><div class="h">'+hr+'</div><div class="a">'+fmt(v.total)+' €</div><span class="bd '+v.pago+'">'+v.pago+'</span><button class="x" onclick="del(\''+v.id+'\')">✕</button></div>';
    });
  });
  $('lista').innerHTML=h;
}
function del(id){
  if(!confirm('¿Borrar este viaje?'))return;
  DB.viajes=DB.viajes.filter(function(v){return String(v.id)!==String(id)});save();renderAll();
}

/* ── copia de seguridad ── */
function bkDias(){var t=localStorage.getItem(BK);return t?(Date.now()-new Date(t))/864e5:null}
function bkTxt(){
  var d=bkDias();
  if(!DB.viajes.length)return 'Aún no hay viajes que guardar.';
  if(d===null)return '⚠️ Nunca has hecho una copia de seguridad.';
  return 'Última copia: hace '+(d>=1?Math.floor(d)+' día(s)':dur(d*864e5))+'.';
}
function renderBk(){
  var d=bkDias(),el=$('bk');$('bkinfo').textContent=bkTxt();
  if(DB.viajes.length&&(d===null||d>=1))
    el.innerHTML='<div class="warn'+(d===null||d>=2?' crit':'')+'"><span>🗂️ '+(d===null?'Nunca has hecho copia de seguridad':'Llevas '+Math.floor(d)+' día(s) sin copia')+'</span><button onclick="exportJSON()">Copiar ahora</button></div>';
  else el.innerHTML='';
}
function dl(name,content,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:type}));a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function marcar(){localStorage.setItem(BK,new Date().toISOString());renderAll()}
function exportJSON(){
  if(!DB.viajes.length)return toast('No hay viajes');
  dl('taxibook_'+ld(new Date())+'.json',JSON.stringify(DB,null,2),'application/json');marcar();toast('💾 Copia descargada');
}
function exportCSV(){
  if(!DB.viajes.length)return toast('No hay viajes');
  var r=['ID,Fecha,Hora,DiaSem,Pago,Plataforma,Total,Efectivo,Dist,Lat,Lng,Direccion,Nota'];
  DB.viajes.forEach(function(v){r.push([v.id,v.fecha,v.hora,v.diaSem,v.pago,v.plataforma||'',v.total,v.efectivo||0,v.dist||0,v.startLat||'',v.startLng||'','"'+(v.startAddr||'').replace(/"/g,"'")+'"','"'+(v.nota||'').replace(/"/g,"'")+'"'].join(','))});
  dl('taxibook_'+ld(new Date())+'.csv',r.join('\n'),'text/csv');marcar();toast('📄 CSV exportado');
}
function parseLine(l){var o=[],c='',q=false;for(var i=0;i<l.length;i++){var ch=l[i];if(ch==='"')q=!q;else if(ch===','&&!q){o.push(c);c=''}else c+=ch}o.push(c);return o}
function importar(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(ev){
    try{
      var ids=new Set(DB.viajes.map(function(v){return String(v.id)})),add=0,txt=ev.target.result;
      if(/\.csv$/i.test(f.name)){
        txt.split(/\r?\n/).slice(1).filter(function(l){return l.trim()}).forEach(function(l,i){
          var c=parseLine(l);if(c.length<8)return;var id=c[0]||('csv_'+Date.now()+'_'+i);if(ids.has(String(id)))return;
          var hr=parseInt(c[2])||0;
          DB.viajes.push({id:id,fecha:c[1],ts:c[1]+'T'+p2(hr)+':00:00',hora:hr,diaSem:dsem(c[1]),pago:c[4]||'efectivo',plataforma:c[5]||'',total:parseFloat(c[6])||0,efectivo:parseFloat(c[7])||0,duracion:0,dist:parseFloat(c[8])||0,startLat:parseFloat(c[9])||null,startLng:parseFloat(c[10])||null,startAddr:c[11]||'',nota:c[12]||''});
          ids.add(String(id));add++;
        });
      }else{
        var imp=JSON.parse(txt);if(!imp||!Array.isArray(imp.viajes))throw new Error('Formato inválido');
        imp.viajes.forEach(function(v){if(!ids.has(String(v.id))){DB.viajes.push(v);ids.add(String(v.id));add++}});
      }
      save();renderAll();toast('✅ '+add+' viajes importados');
    }catch(err){toast('❌ '+err.message)}
  };
  r.readAsText(f);e.target.value='';
}

/* ── mantenimiento ── */
function recalcular(){
  if(!confirm('Se recalculará el día de TODOS los viajes con la regla actual (turnos desde las '+umbral()+':00 = día siguiente). Haz una copia antes. ¿Seguir?'))return;
  var c=0;
  DB.viajes.forEach(function(v){var d=new Date(v.ts);if(isNaN(d))return;var f=fechaTurno(d);if(f!==v.fecha){v.fecha=f;v.diaSem=dsem(f);c++}});
  save();renderAll();toast('🔧 '+c+' viajes corregidos');
}
function purge90(){
  var cut=new Date();cut.setDate(cut.getDate()-90);var cs=ld(cut);
  var n=DB.viajes.filter(function(v){return v.fecha<cs}).length;
  if(!n)return toast('No hay viajes de más de 90 días');
  if(!confirm('¿Borrar '+n+' viajes anteriores a '+cs+'?'))return;
  DB.viajes=DB.viajes.filter(function(v){return v.fecha>=cs});save();renderAll();toast('🗑 '+n+' viajes borrados');
}
function resetAll(){
  if(!confirm('¿Borrar TODOS los datos?')||!confirm(DB.viajes.length+' viajes se eliminarán. ¿Seguro?'))return;
  localStorage.removeItem(K);localStorage.removeItem(K+'_bak');DB={viajes:[]};renderAll();toast('Datos borrados');
}

function toast(m,undo){
  var t=$('toast');t.innerHTML='<span>'+m+'</span>'+(undo?'<button id="undo">Deshacer</button>':'');
  t.style.display='flex';if(undo)$('undo').onclick=function(){undo();t.style.display='none'};
  clearTimeout(tt);tt=setTimeout(function(){t.style.display='none'},undo?5000:2500);
}
function renderAll(){renderViaje();renderLista();renderBk()}
renderAll();
setInterval(renderViaje,60000);
</script>
